[project]
name = "peiwan-server"
version = "0.1.0"
description = "Peiwan aftersales cloud API and async dual-track ASR pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "boto3>=1.35.0",
    "pgvector>=0.3.6",
    "pypinyin>=0.53.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.2,<2"]
funasr-asr = ["funasr>=1.4,<2", "modelscope>=1.30", "torch>=2.2", "torchaudio>=2.2", "librosa", "soundfile"]
dev = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
